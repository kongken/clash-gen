<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>订阅列表 · Clash 订阅管理</title>
  <link rel="stylesheet" href="/assets/panel.css">
</head>
<body>
  {{template "admin_header"}}
  <main class="panel-container">
    <h1>订阅列表</h1>
    <section class="panel-section" aria-labelledby="add-subscription-title">
      <h2 id="add-subscription-title">新建订阅</h2>
      {{if .Error}}<p class="form-error" role="alert">{{.Error}}</p>{{end}}
      <form method="post" action="/admin/subscriptions" class="form-row">
        <label for="create-name">订阅名称</label>
        <input id="create-name" name="name" value="{{.Name}}" maxlength="120" required>
        <button class="button-primary" type="submit">创建订阅</button>
      </form>
    </section>
    <section class="panel-section" aria-label="现有订阅">
      {{if .Subscriptions}}
      <ul class="subscription-list">
        {{range .Subscriptions}}
        <li><a href="/admin/subscriptions/{{.ID}}">{{.Draft.Name}}</a> <span class="status-label">{{template "admin_publication_status" .}}</span></li>
        {{end}}
      </ul>
      {{else}}
      <p>暂无订阅。</p>
      {{end}}
    </section>
  </main>
</body>
</html>
